/* ==========================================================================
   keypad.ini - virtual 4x4 keypad for the Keil uVision simulator (LPC1768)
   Load it in: Options for Target -> Debug -> Initialization File
   Start the program with Debug -> Run, then click the Toolbox buttons.

   The buttons only put a key in a queue. One background signal function
   (keyengine) takes keys from the queue and presses them one at a time.
   The queue is a single 32-bit value holding up to 8 keys (4 bits each),
   because debug scripts do not support arrays.
   ========================================================================== */

unsigned long qv;          /* queued keys, 4 bits each, oldest in bits 3..0 */
unsigned long qn;          /* number of keys waiting                        */
unsigned long cur;         /* key being pressed right now                   */

/* called by the buttons: add key k to the queue (ignored if 8 are waiting) */
FUNC void press (unsigned long k)
{
    if (qn < 8) {
        qv = qv | (k << (4 * qn));
        qn = qn + 1;
    }
}

/* started once below; runs for the whole debug session                     */
signal void keyengine (void)
{
    while (1) {
        if (qn > 0) {
            cur = qv & 15;
            qv = qv >> 4;
            qn = qn - 1;
            sim_key = cur;                 /* hold key down                 */
            swatch(0.08);                  /* 80 ms: longer than debounce   */
            sim_key = 255;                 /* release                       */
            swatch(0.05);                  /* gap before the next key       */
        }
        else {
            swatch(0.002);                 /* idle: check queue every 2 ms  */
        }
    }
}

qv = 0;
qn = 0;
cur = 0;
keyengine();

DEFINE BUTTON "0",        "press(0)"
DEFINE BUTTON "1",        "press(1)"
DEFINE BUTTON "2",        "press(2)"
DEFINE BUTTON "3",        "press(3)"
DEFINE BUTTON "4",        "press(4)"
DEFINE BUTTON "5",        "press(5)"
DEFINE BUTTON "6",        "press(6)"
DEFINE BUTTON "7",        "press(7)"
DEFINE BUTTON "8",        "press(8)"
DEFINE BUTTON "9",        "press(9)"
DEFINE BUTTON "A ENTER",  "press(10)"
DEFINE BUTTON "B BACK",   "press(11)"
DEFINE BUTTON "C CHANGE", "press(12)"
DEFINE BUTTON "D",        "press(13)"
DEFINE BUTTON "E NEXT",   "press(14)"
DEFINE BUTTON "F CANCEL", "press(15)"
